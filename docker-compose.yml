# Granadad: The Darkstreets — reproducible build of the native C++ game.
#
#   .\scripts\gate.ps1               <- scripts/gate.sh off Windows
#
# which is
#
#   docker compose run --rm --build build
#
# with GRANADAD_REVISION set to the commit being built, so the stamp names it
# (see THE STAMP NAMES THE COMMIT below). Type the compose command by hand and
# it builds exactly the same; the stamp just says `unknown`.
#
# It compiles the C++ in a pinned container and drops the finished binaries in
# ./dist. Then, on Windows, natively:
#
#   .\scripts\verify-windows.ps1     <- finishes the gate; see below
#   .\dist\granadad.exe
#
# ---------------------------------------------------------------------------
# THE GATE DOES NOT FINISH IN HERE
# ---------------------------------------------------------------------------
# Docker proves the Linux/GCC half. It cannot prove the half that ships.
#
# sim-core bans float/double so the same bytes decode to the same world state
# on every toolchain — and until task #75 that had been tested on exactly one
# toolchain, because the cross build compiled granadad-content-tests.exe and
# threw it away unexecuted. Now the content directory is read from
# $GRANADAD_CONTENT_DIR at run time, so the .exe ships in dist/ and runs on the
# host against the repo's own content/.
#
# The container also publishes dist/content-fingerprint-linux-gcc.txt: the
# decoded state of every shipped world (section CRCs, per-lane CRC32C, per-form
# / per-material / per-flags / per-fluid histograms over ~2.7M tiles).
# scripts/verify-windows.ps1 produces the same report under mingw/Windows and
# compares the two byte for byte. A difference there is a real determinism
# finding. This container cannot run that script — executing a PE binary under
# wine would prove something about wine.
#
# ---------------------------------------------------------------------------
# WHY `run` AND NOT `up`
# ---------------------------------------------------------------------------
# Because `docker compose up` exits 0 when the container inside it exits 1.
#
# That is not a theory. Point GRANADAD_DIST at an unmounted path and the
# container prints "FATAL: ... is not mounted", compose logs "build-1 exited
# with code 1" — and `echo $?` says 0. A build gate that cannot go red is worse
# than no gate, because it is trusted.
#
# `docker compose run` propagates the container's exit status by construction.
# There is no flag to remember and no flag to forget. (`up --build
# --exit-code-from build` is equivalent, but only if you type all of it, every
# time, and nobody ever does.)
#
# The image build itself already fails loudly either way — a compile error or a
# failed PE check stops `docker compose build`. The hole was only ever in the
# publish step, which is the last thing that runs and the one that decides
# whether dist/ actually got written.
#
# The `guard` service below closes the hole for `up` as well, for the day
# somebody types the old command from memory. See its comment.
#
# ---------------------------------------------------------------------------
# WHAT DOCKER DOES AND DOES NOT DO HERE
# ---------------------------------------------------------------------------
# Docker is the BUILD surface, not the runtime. The container compiles and then
# exits. It does not run the game, does not open a window, does not need a GPU
# and does not want an X server. The artifact it produces is a native Windows
# .exe (PE32+), cross-compiled with mingw-w64 — NOT a Linux binary and NOT a
# WASM/browser target.
#
# The build refuses to publish anything that is not a genuine Windows PE binary
# (see the `file ... | grep PE32+` check in docker/build.Dockerfile), so this
# cannot silently degrade into shipping the wrong kind of executable.
#
# The 1.2 GB content/ tree is NOT copied into the container, with one deliberate
# exception: content/maps/baked/ (three files, 21 KB), which the TROJSAV reader
# tests open and assert against. Everything else — content/art above all — the
# game reads at runtime, from the repo, on your machine. See .dockerignore.
#
# Nothing here writes to content/. It is copied in read-only and never mounted.
#
# ---------------------------------------------------------------------------
# ONE IMAGE PER WORKTREE
# ---------------------------------------------------------------------------
# This file used to pin `image: granadad-build:latest`. Every worktree under
# C:\repositories -- about thirty of them -- built and tagged that one name,
# so two gates running from two trees raced on it: whichever finished last
# owned the tag, and a `run` could start an image compiled from the OTHER
# tree. Not slowness. A wrong answer, with a green exit code on it. It
# happened, six lanes deep, in one week.
#
# So the image is named after the compose project, which defaults to the
# directory this file sits in: fom-kit builds granadad-build-fom-kit,
# flameofmercolas-mvp builds granadad-build-flameofmercolas-mvp. Compose
# exposes the resolved project name as COMPOSE_PROJECT_NAME for interpolation,
# so there is nothing to set and nothing to remember. `build` and `guard`
# still share the one image. Layers are content-addressed, so thirty tags
# cost thirty tiny artifact images and nothing else.
#
# The BuildKit cache mounts (/deps and /build-cache, sharing=locked) are keyed
# by their mount target, not by the tag, so they stay shared across every
# tree. That is the compile cache and sharing it is the point. It also means
# two gates still take turns on it: one machine, one compile at a time. That
# is honest, and it was always so.
#
# ---------------------------------------------------------------------------
# THE STAMP NAMES THE COMMIT
# ---------------------------------------------------------------------------
# `revision:` in dist/GATE-STAMP.txt comes from the GRANADAD_REVISION build
# arg and from nowhere else, because .git is not in the build context (see
# .dockerignore) and the container has no way to ask. It used to default to
# "docker", which reads like an answer, and to a stale hash whenever somebody
# had once set the variable by hand. A reviewer was misled by it and had to
# redo the digest check to find out which tree they were holding.
#
# Now scripts/gate.ps1 (and gate.sh) set it from `git rev-parse --short HEAD`,
# with -dirty appended when a tracked file differs from HEAD -- the same rule
# `git describe --dirty` uses -- and the bare compose command stamps `unknown`.
# A changed revision re-runs the build stage, so a gate through the wrapper
# always executes for a new commit instead of replaying a cached green; the
# cache mounts keep that incremental.

x-granadad: &granadad
  build:
    context: .
    dockerfile: docker/build.Dockerfile
    args:
      # Stamped into the binary (`granadad.exe --version`) and into
      # dist/GATE-STAMP.txt. scripts/gate.ps1 sets it to the commit; by hand
      # it is whatever GRANADAD_REVISION is in your environment, or `unknown`.
      # See THE STAMP NAMES THE COMMIT above.
      GRANADAD_REVISION: ${GRANADAD_REVISION:-unknown}
      BUILD_TYPE: ${BUILD_TYPE:-RelWithDebInfo}
  # Per worktree, on purpose. See ONE IMAGE PER WORKTREE above.
  image: granadad-build-${COMPOSE_PROJECT_NAME}
  # One-shot build step, not a service: never restart it, and never let a
  # retry paper over a red exit.
  restart: "no"
  # Nothing here talks to the network at run time; the deps were fetched
  # during the image build.
  network_mode: none

services:
  build:
    <<: *granadad
    volumes:
      # The one bind mount: finished artifacts land in the repo's dist/.
      - ./dist:/out

  # Not a build step. A seatbelt for the wrong command.
  #
  # `docker compose up` swallows a container's non-zero exit — but it does NOT
  # swallow a DEPENDENCY that failed to complete. So this service exists purely
  # to depend on `build` succeeding. Type the documented `run` command and this
  # never starts; type `up` out of habit and a failed build now surfaces as
  # "dependency failed to start" and a red exit code instead of a green lie.
  #
  # It shares the build's image, so it costs one cached container start and
  # nothing else. Do not give it a bind mount and do not make it do work: the
  # moment it has a job, it stops being a seatbelt and starts being a thing that
  # can fail for its own reasons.
  guard:
    <<: *granadad
    depends_on:
      build:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - 'echo "build published to dist/ — see dist/BUILD-MANIFEST.txt"'
